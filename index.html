<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>个人消费 OA</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f5f6f8;
    color: #222;
}

button,
input,
select,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    max-width: 700px;
    margin: 0 auto;
    min-height: 100vh;
    background: #f5f6f8;
}

/* =========================
   Header
========================= */

.header {
    background: #fff;
    padding: 18px 20px 14px;
    position: sticky;
    top: 0;
    z-index: 20;
    border-bottom: 1px solid #eee;
}

.header-title {
    font-size: 22px;
    font-weight: 700;
}

.header-subtitle {
    margin-top: 4px;
    font-size: 13px;
    color: #888;
}

/* =========================
   Navigation
========================= */

.nav {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    background: #fff;
    border-top: 1px solid #eee;
    border-bottom: 1px solid #eee;
    position: sticky;
    bottom: 0;
    z-index: 30;
}

.nav button {
    border: 0;
    background: #fff;
    padding: 10px 4px 9px;
    color: #888;
    font-size: 12px;
}

.nav button.active {
    color: #111;
    font-weight: 700;
}

.nav-icon {
    font-size: 20px;
    line-height: 22px;
    margin-bottom: 2px;
}

/* =========================
   Main
========================= */

.main {
    padding: 18px 16px 90px;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

/* =========================
   Card
========================= */

.card {
    background: #fff;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 2px 10px rgba(0,0,0,.035);
}

.card-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 12px;
}

.card-title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* =========================
   Dashboard
========================= */

.welcome {
    margin-bottom: 18px;
}

.welcome-title {
    font-size: 26px;
    font-weight: 800;
}

.welcome-subtitle {
    color: #888;
    margin-top: 5px;
    font-size: 14px;
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 14px;
}

.stat {
    background: #fff;
    border-radius: 15px;
    padding: 15px;
}

.stat-label {
    color: #888;
    font-size: 13px;
}

.stat-value {
    font-size: 23px;
    font-weight: 800;
    margin-top: 5px;
}

/* =========================
   Budget
========================= */

.budget-box {
    margin-bottom: 14px;
}

.budget-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 7px;
}

.budget-label {
    font-size: 14px;
    font-weight: 600;
}

.budget-value {
    font-size: 13px;
    color: #777;
}

.progress {
    height: 8px;
    background: #eceef1;
    border-radius: 99px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #111;
    border-radius: 99px;
    transition: width .25s;
}

.progress-bar.warning {
    background: #e7a600;
}

.progress-bar.danger {
    background: #e5484d;
}

/* =========================
   Buttons
========================= */

.btn {
    border: 0;
    border-radius: 11px;
    padding: 11px 15px;
    font-weight: 600;
    font-size: 14px;
}

.btn-primary {
    background: #111;
    color: #fff;
}

.btn-secondary {
    background: #f0f1f3;
    color: #222;
}

.btn-danger {
    background: #fff0f0;
    color: #d93025;
}

.btn-refund {
    background: #fff4e5;
    color: #a45b00;
}

.btn-block {
    width: 100%;
}

.btn + .btn {
    margin-left: 7px;
}

/* =========================
   Form
========================= */

.form-group {
    margin-bottom: 16px;
}

.form-label {
    display: block;
    font-size: 14px;
    font-weight: 650;
    margin-bottom: 7px;
}

.form-help {
    color: #999;
    font-size: 12px;
    margin-top: 5px;
}

input,
select,
textarea {
    width: 100%;
    border: 1px solid #ddd;
    background: #fff;
    border-radius: 11px;
    padding: 11px 12px;
    outline: none;
}

input:focus,
select:focus,
textarea:focus {
    border-color: #999;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

/* =========================
   Choice
========================= */

.choice-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 9px;
}

.choice {
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 12px;
    background: #fff;
    text-align: left;
}

.choice.selected {
    border-color: #111;
    background: #f3f3f3;
}

.choice-title {
    font-weight: 650;
    font-size: 14px;
}

.choice-desc {
    margin-top: 3px;
    color: #888;
    font-size: 12px;
}

/* =========================
   Status
========================= */

.status {
    display: inline-flex;
    align-items: center;
    border-radius: 99px;
    padding: 4px 9px;
    font-size: 11px;
    font-weight: 650;
}

.status-pending {
    background: #fff6db;
    color: #9a6a00;
}

.status-approved {
    background: #e9f4ff;
    color: #1671c5;
}

.status-purchased {
    background: #eaf8ee;
    color: #16823c;
}

.status-refunded {
    background: #f1edf9;
    color: #7253a6;
}

.status-rejected {
    background: #fff0f0;
    color: #d93025;
}

/* =========================
   Expense Card
========================= */

.expense-card {
    background: #fff;
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 11px;
}

.expense-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.expense-name {
    font-size: 16px;
    font-weight: 700;
}

.expense-price {
    font-size: 17px;
    font-weight: 800;
    white-space: nowrap;
}

.expense-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 9px;
}

.meta-tag {
    font-size: 11px;
    color: #777;
    background: #f3f4f5;
    border-radius: 7px;
    padding: 4px 7px;
}

.expense-time {
    color: #999;
    font-size: 12px;
    margin-top: 10px;
}

.expense-note {
    color: #666;
    font-size: 13px;
    margin-top: 9px;
    line-height: 1.5;
}

/* =========================
   Empty
========================= */

.empty {
    text-align: center;
    padding: 45px 20px;
    color: #999;
}

.empty-icon {
    font-size: 36px;
    margin-bottom: 8px;
}

.empty-text {
    font-size: 14px;
}

/* =========================
   Detail
========================= */

.detail-title {
    font-size: 22px;
    font-weight: 800;
}

.detail-price {
    font-size: 30px;
    font-weight: 850;
    margin-top: 8px;
}

.detail-section {
    margin-top: 18px;
}

.detail-section-title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 9px;
}

.detail-row {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    padding: 9px 0;
    border-bottom: 1px solid #f0f0f0;
}

.detail-row:last-child {
    border-bottom: 0;
}

.detail-key {
    color: #888;
    font-size: 13px;
}

.detail-value {
    font-size: 13px;
    text-align: right;
}

/* =========================
   Approval
========================= */

.approval-step {
    display: flex;
    gap: 12px;
    position: relative;
    padding-bottom: 18px;
}

.approval-step:last-child {
    padding-bottom: 0;
}

.approval-line {
    position: absolute;
    left: 11px;
    top: 25px;
    bottom: 0;
    width: 1px;
    background: #ddd;
}

.approval-step:last-child .approval-line {
    display: none;
}

.approval-dot {
    width: 23px;
    height: 23px;
    border-radius: 50%;
    background: #eee;
    color: #999;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 12px;
    flex-shrink: 0;
    z-index: 1;
}

.approval-step.active .approval-dot {
    background: #111;
    color: #fff;
}

.approval-step.done .approval-dot {
    background: #16823c;
    color: #fff;
}

.approval-content {
    flex: 1;
}

.approval-title {
    font-size: 14px;
    font-weight: 650;
}

.approval-desc {
    font-size: 12px;
    color: #999;
    margin-top: 3px;
}

/* =========================
   Category Budget
========================= */

.category-budget {
    margin-bottom: 14px;
}

.category-budget-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
}

.category-budget-name {
    font-weight: 650;
    font-size: 14px;
}

.category-budget-value {
    color: #888;
    font-size: 12px;
}

.category-budget-sub {
    color: #999;
    font-size: 11px;
    margin-top: 4px;
}

/* =========================
   Settings
========================= */

.setting-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid #eee;
}

.setting-row:last-child {
    border-bottom: 0;
}

.setting-label {
    font-size: 14px;
    font-weight: 600;
}

.setting-desc {
    font-size: 12px;
    color: #999;
    margin-top: 3px;
}

.setting-input {
    width: 120px;
    text-align: right;
}

.category-setting {
    padding: 13px 0;
    border-bottom: 1px solid #eee;
}

.category-setting:last-child {
    border-bottom: 0;
}

.category-setting-title {
    font-weight: 650;
    font-size: 14px;
    margin-bottom: 9px;
}

.category-setting-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.category-setting-grid label {
    font-size: 11px;
    color: #999;
}

.category-setting-grid input {
    margin-top: 4px;
}

/* =========================
   Toast
========================= */

.toast {
    position: fixed;
    left: 50%;
    bottom: 85px;
    transform: translateX(-50%) translateY(15px);
    background: rgba(20,20,20,.92);
    color: #fff;
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: all .25s;
    z-index: 100;
    max-width: 85%;
    text-align: center;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* =========================
   Modal
========================= */

.modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.4);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 80;
}

.modal-mask.show {
    display: flex;
}

.modal {
    width: 100%;
    max-width: 700px;
    background: #fff;
    border-radius: 20px 20px 0 0;
    padding: 20px;
    max-height: 90vh;
    overflow-y: auto;
}

.modal-title {
    font-size: 18px;
    font-weight: 750;
    margin-bottom: 15px;
}

.modal-buttons {
    display: flex;
    margin-top: 18px;
}

.modal-buttons .btn {
    flex: 1;
}

/* =========================
   Responsive
========================= */

@media (min-width: 701px) {
    .nav {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 680px;
        border-radius: 16px;
        box-shadow: 0 5px 25px rgba(0,0,0,.1);
        border: 1px solid #eee;
    }

    .main {
        padding-bottom: 110px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <div class="header-title">个人消费 OA</div>
        <div class="header-subtitle">先审批，再消费</div>
    </header>

    <main class="main">

        <!-- =========================
             首页
        ========================== -->

        <section id="page-home" class="page active">

            <div class="welcome">
                <div class="welcome-title">消费控制台</div>
                <div class="welcome-subtitle">把真正值得买的东西留下来</div>
            </div>

            <div class="stats-grid">

                <div class="stat">
                    <div class="stat-label">审批中</div>
                    <div class="stat-value" id="statPending">0</div>
                </div>

                <div class="stat">
                    <div class="stat-label">已通过</div>
                    <div class="stat-value" id="statApproved">0</div>
                </div>

                <div class="stat">
                    <div class="stat-label">已购买</div>
                    <div class="stat-value" id="statPurchased">0</div>
                </div>

                <div class="stat">
                    <div class="stat-label">申请总数</div>
                    <div class="stat-value" id="statTotal">0</div>
                </div>

            </div>

            <!-- 总预算 -->

            <div class="card">

                <div class="card-title">总预算</div>

                <div class="budget-box">

                    <div class="budget-row">
                        <div class="budget-label">本月预算</div>
                        <div class="budget-value" id="homeMonthlyBudgetText">
                            ¥0 / ¥0
                        </div>
                    </div>

                    <div class="progress">
                        <div id="homeMonthlyProgress"
                             class="progress-bar"></div>
                    </div>

                    <div class="budget-row" style="margin-top:12px;">
                        <div class="budget-label">年度预算</div>
                        <div class="budget-value" id="homeYearlyBudgetText">
                            ¥0 / ¥0
                        </div>
                    </div>

                    <div class="progress">
                        <div id="homeYearlyProgress"
                             class="progress-bar"></div>
                    </div>

                </div>

                <div class="detail-row">
                    <div class="detail-key">本月已消费</div>
                    <div class="detail-value" id="homeMonthUsed">¥0</div>
                </div>

                <div class="detail-row">
                    <div class="detail-key">本月剩余</div>
                    <div class="detail-value" id="homeMonthRemaining">¥0</div>
                </div>

                <div class="detail-row">
                    <div class="detail-key">年度已消费</div>
                    <div class="detail-value" id="homeYearUsed">¥0</div>
                </div>

                <div class="detail-row">
                    <div class="detail-key">年度剩余</div>
                    <div class="detail-value" id="homeYearRemaining">¥0</div>
                </div>

            </div>

            <!-- 分类预算 -->

            <div class="card">

                <div class="card-title-row">
                    <div class="card-title" style="margin-bottom:0;">
                        分类预算
                    </div>
                </div>

                <div id="homeCategoryBudgets"></div>

            </div>

            <button class="btn btn-primary btn-block"
                    onclick="showPage('new')">
                ＋ 新建消费申请
            </button>

        </section>


        <!-- =========================
             待审批
        ========================== -->

        <section id="page-pending" class="page">

            <div class="card-title">待处理</div>

            <div id="pendingList"></div>

        </section>


        <!-- =========================
             记录
        ========================== -->

        <section id="page-records" class="page">

            <div class="card-title">全部记录</div>

            <div id="recordsList"></div>

        </section>


        <!-- =========================
             设置
        ========================== -->

        <section id="page-settings" class="page">

            <div class="card-title">设置</div>

            <!-- 总预算 -->

            <div class="card">

                <div class="card-title">总预算</div>

                <div class="setting-row">

                    <div>
                        <div class="setting-label">每月总预算</div>
                        <div class="setting-desc">
                            所有分类合计
                        </div>
                    </div>

                    <input
                        id="settingMonthlyBudget"
                        class="setting-input"
                        type="number"
                        min="0"
                        step="100"
                        onchange="saveTotalBudget()"
                    >

                </div>

                <div class="setting-row">

                    <div>
                        <div class="setting-label">每年总预算</div>
                        <div class="setting-desc">
                            所有分类合计
                        </div>
                    </div>

                    <input
                        id="settingYearlyBudget"
                        class="setting-input"
                        type="number"
                        min="0"
                        step="100"
                        onchange="saveTotalBudget()"
                    >

                </div>

            </div>


            <!-- 分类预算 -->

            <div class="card">

                <div class="card-title">分类预算</div>

                <div id="categorySettings"></div>

            </div>


            <!-- 数据管理 -->

            <div class="card">

                <div class="card-title">数据管理</div>

                <button class="btn btn-secondary btn-block"
                        onclick="exportData()">
                    导出数据
                </button>

                <div style="height:8px;"></div>

                <button class="btn btn-secondary btn-block"
                        onclick="document.getElementById('importFile').click()">
                    导入数据
                </button>

                <input
                    id="importFile"
                    type="file"
                    accept=".json,application/json"
                    style="display:none"
                    onchange="importData(event)"
                >

                <div style="height:8px;"></div>

                <button class="btn btn-danger btn-block"
                        onclick="clearAllData()">
                    清空全部数据
                </button>

            </div>

        </section>


        <!-- =========================
             新建申请
        ========================== -->

        <section id="page-new" class="page">

            <div class="card">

                <div class="card-title">新建消费申请</div>

                <div class="form-group">

                    <label class="form-label">
                        想买什么？
                    </label>

                    <input
                        id="newName"
                        type="text"
                        placeholder="例如：新鼠标"
                    >

                </div>


                <div class="form-group">

                    <label class="form-label">
                        价格
                    </label>

                    <input
                        id="newPrice"
                        type="number"
                        min="0"
                        step="0.01"
                        placeholder="0"
                    >

                </div>


                <div class="form-group">

                    <label class="form-label">
                        分类
                    </label>

                    <select id="newCategory"></select>

                </div>


                <div class="form-group">

                    <label class="form-label">
                        备注
                    </label>

                    <textarea
                        id="newNote"
                        placeholder="为什么想买？可以写下购买理由。"
                    ></textarea>

                </div>


                <div class="form-group">

                    <label class="form-label">
                        有用程度
                    </label>

                    <div id="usefulnessChoices"
                         class="choice-grid"></div>

                </div>


                <div class="form-group">

                    <label class="form-label">
                        使用频率
                    </label>

                    <div id="frequencyChoices"
                         class="choice-grid"></div>

                </div>


                <div class="form-group">

                    <label class="form-label">
                        已有替代品
                    </label>

                    <div id="alternativeChoices"
                         class="choice-grid"></div>

                </div>


                <div class="form-group">

                    <label class="form-label">
                        价格合理性
                    </label>

                    <div id="priceChoices"
                         class="choice-grid"></div>

                </div>


                <button
                    class="btn btn-primary btn-block"
                    onclick="submitApplication()">
                    提交消费申请
                </button>

            </div>

        </section>


        <!-- =========================
             详情
        ========================== -->

        <section id="page-detail" class="page">

            <div id="detailContent"></div>

        </section>

    </main>


    <!-- =========================
         Bottom Nav
    ========================== -->

    <nav class="nav">

        <button
            id="nav-home"
            class="active"
            onclick="showPage('home')">

            <div class="nav-icon">⌂</div>
            首页

        </button>

        <button
            id="nav-pending"
            onclick="showPage('pending')">

            <div class="nav-icon">✓</div>
            待处理

        </button>

        <button
            id="nav-records"
            onclick="showPage('records')">

            <div class="nav-icon">☷</div>
            记录

        </button>

        <button
            id="nav-settings"
            onclick="showPage('settings')">

            <div class="nav-icon">⚙</div>
            设置

        </button>

    </nav>

</div>


<!-- =========================
     Modal
========================= -->

<div id="modalMask" class="modal-mask">

    <div class="modal">

        <div id="modalTitle" class="modal-title"></div>

        <div id="modalContent"></div>

        <div class="modal-buttons">

            <button
                class="btn btn-secondary"
                onclick="closeModal()">
                取消
            </button>

            <button
                id="modalConfirm"
                class="btn btn-primary"
                onclick="confirmModal()">
                确定
            </button>

        </div>

    </div>

</div>


<div id="toast" class="toast"></div>


<script>

/* ============================================================
   数据结构
============================================================ */

const STORAGE_KEY = "personal_expense_oa_v1";


const CATEGORIES = [
    "电子产品",
    "娱乐",
    "衣服",
    "食品",
    "宠物",
    "交通",
    "旅行",
    "家居",
    "学习",
    "其他"
];


const DEFAULT_CATEGORY_BUDGETS = {

    "电子产品": {
        monthly: 3000,
        yearly: 15000
    },

    "娱乐": {
        monthly: 1000,
        yearly: 5000
    },

    "衣服": {
        monthly: 1000,
        yearly: 5000
    },

    "食品": {
        monthly: 2000,
        yearly: 24000
    },

    "宠物": {
        monthly: 1000,
        yearly: 12000
    },

function loadData() {

    let raw = localStorage.getItem(STORAGE_KEY);

    if (!raw) {

        return {

            expenses: [],

            categoryBudgets:
                JSON.parse(
                    JSON.stringify(DEFAULT_CATEGORY_BUDGETS)
                ),

            totalBudget:
                JSON.parse(
                    JSON.stringify(DEFAULT_TOTAL_BUDGET)
                )

        };

    }


    try {

        let parsed = JSON.parse(raw);


        if (!parsed.expenses) {
            parsed.expenses = [];
        }


        if (!parsed.categoryBudgets) {

            parsed.categoryBudgets =
                JSON.parse(
                    JSON.stringify(DEFAULT_CATEGORY_BUDGETS)
                );

        } else {

            for (const category of CATEGORIES) {

                if (!parsed.categoryBudgets[category]) {

                    parsed.categoryBudgets[category] = {
                        ...DEFAULT_CATEGORY_BUDGETS[category]
                    };

                }

            }

        }


        if (!parsed.totalBudget) {

            parsed.totalBudget =
                JSON.parse(
                    JSON.stringify(DEFAULT_TOTAL_BUDGET)
                );

        } else {

            if (
                typeof parsed.totalBudget.monthly !== "number"
            ) {
                parsed.totalBudget.monthly =
                    DEFAULT_TOTAL_BUDGET.monthly;
            }

            if (
                typeof parsed.totalBudget.yearly !== "number"
            ) {
                parsed.totalBudget.yearly =
                    DEFAULT_TOTAL_BUDGET.yearly;
            }

        }


        return parsed;

    } catch (e) {

        console.error(e);

        return {

            expenses: [],

            categoryBudgets:
                JSON.parse(
                    JSON.stringify(DEFAULT_CATEGORY_BUDGETS)
                ),

            totalBudget:
                JSON.parse(
                    JSON.stringify(DEFAULT_TOTAL_BUDGET)
                )

        };

    }

}

/* ============================================================
   Date
============================================================ */

function localDateString(date = new Date()) {

    const year = date.getFullYear();

    const month =
        String(date.getMonth() + 1).padStart(2, "0");

    const day =
        String(date.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;

}


function isSameMonth(dateString) {

    if (!dateString) return false;

    const d = new Date(dateString);

    const now = new Date();

    return (
        d.getFullYear() === now.getFullYear() &&
        d.getMonth() === now.getMonth()
    );

}


function isSameYear(dateString) {

    if (!dateString) return false;

    const d = new Date(dateString);

    const now = new Date();

    return (
        d.getFullYear() === now.getFullYear()
    );

}


function formatDateTime(dateString) {

    if (!dateString) return "-";

    const d = new Date(dateString);

    if (isNaN(d.getTime())) return dateString;

    return d.toLocaleString(
        "zh-CN",
        {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}

function statusText(status) {

    const map = {

        pending: "审批中",

        approved: "已通过",

        purchased: "已购买",

        refunded: "已退款",

        rejected: "已拒绝"

    };

    return map[status] || status;

}


function statusClass(status) {

    const map = {

        pending: "status-pending",

        approved: "status-approved",

        purchased: "status-purchased",

        refunded: "status-refunded",

        rejected: "status-rejected"

    };

    return map[status] || "status-pending";

}


/* ============================================================
   Spending
   重要：
   只有 purchased 才占用额度。
   refunded 不占用额度。
============================================================ */

function getCategorySpending(category) {

    let monthUsed = 0;

    let yearUsed = 0;


    data.expenses.forEach(expense => {

        if (
            expense.status !== "purchased"
        ) {
            return;
        }


        if (
            expense.category !== category
        ) {
            return;
        }


        const price =
            Number(expense.price) || 0;


        if (isSameMonth(expense.purchasedAt || expense.createdAt)) {

            monthUsed += price;

        }


        if (isSameYear(expense.purchasedAt || expense.createdAt)) {

            yearUsed += price;

        }

    });


    return {

        monthUsed,

        yearUsed

    };

}


function getTotalBudgetInfo(extraPrice = 0) {

    let monthUsed = 0;

    let yearUsed = 0;


    data.expenses.forEach(expense => {

        /*
         * 这里故意只计算 purchased。
         *
         * pending / approved 不占用额度
         * refunded 不占用额度
         */

        if (
            expense.status !== "purchased"
        ) {
            return;
        }


        const price =
            Number(expense.price) || 0;


        if (
            isSameMonth(
                expense.purchasedAt ||
                expense.createdAt
            )
        ) {

            monthUsed += price;

        }


        if (
            isSameYear(
                expense.purchasedAt ||
                expense.createdAt
            )
        ) {

            yearUsed += price;

        }

    });


    return {

        monthUsed,

        yearUsed,

        monthlyBudget:
            Number(data.totalBudget.monthly) || 0,

        yearlyBudget:
            Number(data.totalBudget.yearly) || 0,

        monthRemaining:
            (
                Number(data.totalBudget.monthly) || 0
            ) - monthUsed - extraPrice,

        yearRemaining:
            (
                Number(data.totalBudget.yearly) || 0
            ) - yearUsed - extraPrice

    };

}


/* ============================================================
   Progress
============================================================ */

function progressPercent(used, budget) {

    if (!budget || budget <= 0) {

        return used > 0 ? 100 : 0;

    }

    return Math.min(
        100,
        Math.max(
            0,
            used / budget * 100
        )
    );

}


function applyProgressStyle(element, percent) {

    element.style.width =
        `${Math.min(100, percent)}%`;

    element.classList.remove(
        "warning",
        "danger"
    );


    if (percent >= 100) {

        element.classList.add("danger");

    } else if (percent >= 80) {

        element.classList.add("warning");

    }

}

        });


    const nav =

        nav.classList.add("active");

        renderHome();

    if (page === "pending") {

        renderPending();

    }

    if (page === "records") {

        renderRecords();

    }

    if (page === "settings") {

        renderSettings();

    }

    if (page === "new") {

    }

}

function submitApplication() {

    const name =
        document.getElementById(
            "newName"
        ).value.trim();


    const price =
        Number(
            document.getElementById(
                "newPrice"
            ).value
        );


    const category =
        document.getElementById(
            "newCategory"
        ).value;


    const note =
        document.getElementById(
            "newNote"
        ).value.trim();


    if (!name) {

        showToast("请输入想买的东西");

        return;

    }


    if (
        !Number.isFinite(price) ||
        price <= 0
    ) {

        showToast("请输入正确的价格");

        return;

    }


    if (!newFormValues.usefulness) {

        showToast("请完成「有用程度」");

        return;

    }


    if (!newFormValues.frequency) {

        showToast("请完成「使用频率」");

        return;

    }


    if (!newFormValues.alternative) {

        showToast("请完成「已有替代品」");

        return;

    }


    if (!newFormValues.price) {

        showToast("请完成「价格合理性」");

        return;

    }


    const expense = {

        id:
            Date.now().toString() +
            Math.random()
                .toString(36)
                .substring(2, 8),

        name,

        price,

        category,

        note,

        usefulness:
            newFormValues.usefulness,

        frequency:
            newFormValues.frequency,

        alternative:
            newFormValues.alternative,

        priceReason:
            newFormValues.price,

        status: "pending",

        createdAt:
            new Date().toISOString(),

        purchasedAt: null,

        refundedAt: null

    };


    data.expenses.push(expense);

    saveData();


    newFormValues = {

        usefulness: null,

        frequency: null,

        alternative: null,

        price: null

    };


    document.getElementById("newName")
        .value = "";

    document.getElementById("newPrice")
        .value = "";

    document.getElementById("newNote")
        .value = "";


    showToast("申请已提交");


    showExpense(expense.id);

                color:#16823c;
                margin-bottom:12px;
            ">
                本笔消费目前正在占用预算。
            </div>
        `;

    } else if (expense.status === "refunded") {

        budgetDescription = `
            <div style="
                font-size:12px;
                color:#7253a6;
                margin-bottom:12px;
            ">
                本笔消费已经退款，不再占用预算。
            </div>
        `;

    } else {

        budgetDescription = `
            <div style="
                font-size:12px;
                color:#888;
                margin-bottom:12px;
            ">
                如果购买这件商品，以下是加入本笔金额后的预算情况。
            </div>
        `;

    }


    container.innerHTML = `

        <div class="card">

            <div class="detail-title">
                ${escapeHtml(expense.name)}
            </div>

            <div class="detail-price">
                ¥${formatMoney(expense.price)}
            </div>

            <div class="expense-meta">

                <span class="status ${statusClass(expense.status)}">
                    ${statusText(expense.status)}
                </span>

                <span class="meta-tag">
                    ${escapeHtml(expense.category)}
                </span>

            </div>


            <div class="detail-section">

                <div class="detail-section-title">
                    申请信息
                </div>

                <div class="detail-row">

                    <div class="detail-key">
                        申请时间
                    </div>

                    <div class="detail-value">
                        ${formatDateTime(expense.createdAt)}
                    </div>

                </div>

                ${
                    expense.purchasedAt
                    ?
                    `
                    <div class="detail-row">

                        <div class="detail-key">
                            购买时间
                        </div>

                        <div class="detail-value">
                            ${formatDateTime(expense.purchasedAt)}
                        </div>

                    </div>
                    `
                    :
                    ""
                }

                ${
                    expense.refundedAt
                    ?
                    `
                    <div class="detail-row">

                        <div class="detail-key">
                            退款时间
                        </div>

                        <div class="detail-value">
                            ${formatDateTime(expense.refundedAt)}
                        </div>

                    </div>
                    `
                    :
                    ""
                }

                <div class="detail-row">

                    <div class="detail-key">
                        分类
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(expense.category)}
                    </div>

                </div>

                ${
                    expense.note
                    ?
                    `
                    <div class="detail-row">

                        <div class="detail-key">
                            备注
                        </div>

                        <div class="detail-value">
                            ${escapeHtml(expense.note)}
                        </div>

                    </div>
                    `
                    :
                    ""
                }

            </div>

        </div>


        <div class="card">

            <div class="card-title">
                审批判断
            </div>

            ${renderApprovalStep(
                "有用程度",
                getChoiceTitle(
                    "usefulness",
                    expense.usefulness
                ),
                true
            )}

            ${renderApprovalStep(
                "使用频率",
                getChoiceTitle(
                    "frequency",
                    expense.frequency
                ),
                true
            )}

            ${renderApprovalStep(
                "已有替代品",
                getChoiceTitle(
                    "alternative",
                    expense.alternative
                ),
                true
            )}

            ${renderApprovalStep(
                "价格合理性",
                getChoiceTitle(
                    "price",
                    expense.priceReason
                ),
                true
            )}

            ${renderApprovalStep(
                "最终决定",
                statusText(expense.status),
                expense.status !== "pending"
            )}

        </div>


        <div class="card">

            <div class="card-title">
                预算影响
            </div>

            ${budgetDescription}

            <div class="detail-row">

                <div class="detail-key">
                    本月总预算
                </div>

                <div class="detail-value">

                    ¥${formatMoney(
                        totalBudget.monthUsed
                    )}

                    /
                    ¥${formatMoney(
                        totalBudget.monthlyBudget
                    )}

                    <br>

                    <span style="color:#999;">
                        剩余 ¥${formatMoney(
                            totalBudget.monthRemaining
                        )}
                    </span>

                </div>

            </div>


            <div class="detail-row">

                <div class="detail-key">
                    年度总预算
                </div>

                <div class="detail-value">

                    ¥${formatMoney(
                        totalBudget.yearUsed
                    )}

                    /
                    ¥${formatMoney(
                        totalBudget.yearlyBudget
                    )}

                    <br>

                    <span style="color:#999;">
                        剩余 ¥${formatMoney(
                            totalBudget.yearRemaining
                        )}
                    </span>

                </div>

            </div>


            <div class="detail-row">

                <div class="detail-key">
                    ${escapeHtml(expense.category)} 本月预算
                </div>

                <div class="detail-value">

                    ¥${formatMoney(
                        categorySpending.monthUsed
                    )}

                    /
                    ¥${formatMoney(
                        categoryBudget.monthly
                    )}

                    <br>

                    <span style="color:#999;">
                        剩余
                        ¥${formatMoney(
                            categoryBudget.monthly -
                            categorySpending.monthUsed -
                            (
                                expense.status === "purchased"
                                ? 0
                                : expense.status === "refunded"
                                ? 0
                                : Number(expense.price)
                            )
                        )}

                </div>

            </div>


            <div class="detail-row">

                <div class="detail-key">
                    ${escapeHtml(expense.category)} 年度预算
                </div>

                <div class="detail-value">

                    ¥${formatMoney(
                        categorySpending.yearUsed
                    )}

                    /
                    ¥${formatMoney(
                        categoryBudget.yearly
                    )}

                    <br>

                    <span style="color:#999;">
                        剩余
                        ¥${formatMoney(
                            categoryBudget.yearly -
                            categorySpending.yearUsed -
                            (
                                expense.status === "purchased"
                                ? 0
                                : expense.status === "refunded"
                                ? 0
                                : Number(expense.price)
                            )
                        )}
                    </span>

                </div>

            </div>

        </div>


        ${actionHtml}


        <button

            onclick="showPage('records')"

}


/* ============================================================
   Approval
============================================================ */

function renderApprovalStep(
    title,
    desc,
    done
) {

    return `

        <div class="approval-step ${done ? "done" : ""}">

            <div class="approval-line"></div>

            <div class="approval-dot">
                ${done ? "✓" : "•"}
            </div>

            <div class="approval-content">

                <div class="approval-title">
                    ${escapeHtml(title)}
                </div>

                <div class="approval-desc">
                    ${escapeHtml(desc || "待处理")}
                </div>

            </div>

        </div>

    `;

}


/* ============================================================
   Approve
============================================================ */

function approveExpense(id) {

    const expense =
        data.expenses.find(
            x => x.id === id
        );


    if (!expense) return;


    if (
        expense.status !== "pending"
    ) {

        showToast("当前状态无法审批");

        return;

    }


    expense.status = "approved";

    expense.approvedAt =
        new Date().toISOString();


    saveData();


    showToast("已审批通过");

    showExpense(id);

}


/* ============================================================
   Reject
============================================================ */

function rejectExpense(id) {

    const expense =
        data.expenses.find(
            x => x.id === id
        );


    if (!expense) return;


    if (
        expense.status !== "pending"
    ) {

        showToast("当前状态无法拒绝");

        return;

    }


    openModal(

        "拒绝申请",

        `
            <div style="
                color:#666;
                font-size:14px;
                line-height:1.6;
            ">
                确定拒绝「${escapeHtml(expense.name)}」吗？
            </div>
        `,

        () => {

            expense.status = "rejected";

            expense.rejectedAt =
                new Date().toISOString();


            saveData();


            closeModal();

            showToast("申请已拒绝");

            showExpense(id);

        }

    );

}


/* ============================================================
   Purchased
============================================================ */

function markPurchased(id) {

    const expense =
        data.expenses.find(
            x => x.id === id
        );


    if (!expense) return;


    if (
        expense.status !== "approved"
    ) {

        showToast("只有审批通过的申请才能标记为已购买");

        return;

    }


    openModal(

        "确认购买",

        `
            <div style="
                color:#555;
                font-size:14px;
                line-height:1.7;
            ">

                确定已经购买：

                <br>

                <strong>
                    ${escapeHtml(expense.name)}
                </strong>

                <br>

                金额：
                <strong>
                    ¥${formatMoney(expense.price)}
                </strong>

                <br><br>

                购买后，这笔金额会正式占用
                <strong>总预算</strong>
                和
                <strong>${escapeHtml(expense.category)}分类预算</strong>。

            </div>
        `,

        () => {

            expense.status = "purchased";

            expense.purchasedAt =
                new Date().toISOString();


            /*
             * 如果未来重复操作，这里不应该产生新的购买时间。
             * 正常情况下 approved -> purchased 只发生一次。
             */

            saveData();


            closeModal();

            showToast("已标记为购买，预算已占用");

            showExpense(id);

        }

    );

}


/* ============================================================
   ★ Refund
============================================================ */

function markRefunded(id) {

    const expense =
        data.expenses.find(
            x => x.id === id
        );


    if (!expense) return;


    /*
     * 只有真正购买过的东西才能退款。
     */

    if (
        expense.status !== "purchased"
    ) {

        showToast("只有已购买的记录才能标记为已退款");

        return;

    }


    openModal(

        "确认退款",

        `
            <div style="
                color:#555;
                font-size:14px;
                line-height:1.7;
            ">

                确定「${escapeHtml(expense.name)}」
                最终已经退款了吗？

                <br><br>

                退款金额：

                <strong>
                    ¥${formatMoney(expense.price)}
                </strong>

                <br><br>

                退款后：

                <br>

                • 记录仍然保留

                <br>

                • 购买时间仍然保留

                <br>

                • 退款时间会被记录

                <br>

                •
                <strong>
                    ¥${formatMoney(expense.price)}
                </strong>
                会从总预算中释放

                <br>

                •
                <strong>
                    ${escapeHtml(expense.category)}
                </strong>
                分类预算也会释放

            </div>
        `,

        () => {

            /*
             * 核心：
             * purchased -> refunded
             *
             * spending 函数只计算 purchased，
             * 因此状态变成 refunded 后，
             * 预算会自动释放。
             */

            expense.status = "refunded";

            expense.refundedAt =
                new Date().toISOString();


            saveData();


            closeModal();

            showToast(
                `已退款，¥${formatMoney(expense.price)} 预算已释放`
            );


            showExpense(id);

        }

    );

}


/* ============================================================
   Settings
============================================================ */

function renderSettings() {

    document.getElementById(
        "settingMonthlyBudget"
    ).value =
        data.totalBudget.monthly;


    document.getElementById(
        "settingYearlyBudget"
    ).value =
        data.totalBudget.yearly;


    renderCategorySettings();

}


function saveTotalBudget() {

    const monthly =
        Number(
            document.getElementById(
                "settingMonthlyBudget"
            ).value
        );


    const yearly =
        Number(
            document.getElementById(
                "settingYearlyBudget"
            ).value
        );


    if (
        !Number.isFinite(monthly) ||
        monthly < 0
    ) {

        showToast("每月预算不正确");

        return;

    }


    if (
        !Number.isFinite(yearly) ||
        yearly < 0
    ) {

        showToast("每年预算不正确");

        return;

    }


    data.totalBudget.monthly =
        monthly;


    data.totalBudget.yearly =
        yearly;


    saveData();

    renderHome();

    showToast("总预算已保存");

}


function renderCategorySettings() {

    const container =
        document.getElementById(
            "categorySettings"
        );


    container.innerHTML = "";


    CATEGORIES.forEach(category => {

        const budget =
            data.categoryBudgets[category];


        const div =
            document.createElement("div");


        div.className =
            "category-setting";


        div.innerHTML = `

            <div class="category-setting-title">
                ${escapeHtml(category)}
            </div>

            <div class="category-setting-grid">

                <label>

                    每月预算

                    <input
                        type="number"
                        min="0"
                        step="100"
                        value="${budget.monthly}"
                        onchange="saveCategoryBudget(
                            '${escapeJs(category)}',
                            'monthly',
                            this.value
                        )"
                    >

                </label>

                <label>

                    每年预算

                    <input
                        type="number"
                        min="0"
                        step="100"
                        value="${budget.yearly}"
                        onchange="saveCategoryBudget(
                            '${escapeJs(category)}',
                            'yearly',
                            this.value
                        )"
                    >

                </label>

            </div>

        `;


        container.appendChild(div);

    });

}


function saveCategoryBudget(
    category,
    type,
    value
) {

    const number =
        Number(value);


    if (
        !Number.isFinite(number) ||
        number < 0
    ) {

        showToast("预算金额不正确");

        renderSettings();

        return;

    }


    data.categoryBudgets[
        category
    ][type] = number;


    saveData();

    renderHome();

    showToast(
        `${category} ${type === "monthly" ? "每月" : "每年"}预算已保存`
    );

}


/* ============================================================
   Export
============================================================ */

function exportData() {

    const json =
        JSON.stringify(
            data,
            null,
            2
        );


    const blob =
        new Blob(
            [json],
            {
                type: "application/json"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");


    a.href = url;

    a.download =
        `个人消费OA备份_${localDateString()}.json`;


    document.body.appendChild(a);

    a.click();

    a.remove();


    URL.revokeObjectURL(url);


    showToast("数据已导出");

}


/* ============================================================
   Import
============================================================ */

function importData(event) {

    const file =
        event.target.files[0];


    if (!file) return;


    const reader =
        new FileReader();


    reader.onload = function(e) {

        try {

            const imported =
                JSON.parse(
                    e.target.result
                );


            if (
                !imported ||
                !Array.isArray(
                    imported.expenses
                )
            ) {

                throw new Error(
                    "invalid"
                );

            }


            if (
                !imported.categoryBudgets
            ) {

                imported.categoryBudgets =
                    JSON.parse(
                        JSON.stringify(
                            DEFAULT_CATEGORY_BUDGETS
                        )
                    );

            }


            if (
                !imported.totalBudget
            ) {

                imported.totalBudget =
                    JSON.parse(
                        JSON.stringify(
                            DEFAULT_TOTAL_BUDGET
                        )
                    );

            }


            /*
             * 确保旧数据导入后也有所有分类。
             */

            CATEGORIES.forEach(category => {

                if (
                    !imported.categoryBudgets[category]
                ) {

                    imported.categoryBudgets[category] =
                        {
                            ...DEFAULT_CATEGORY_BUDGETS[category]
                        };

                }

            });


            /*
             * 确保旧记录拥有退款字段。
             */

            imported.expenses.forEach(expense => {

                if (
                    typeof expense.refundedAt ===
                    "undefined"
                ) {

                    expense.refundedAt = null;

                }

            });


            data = imported;


            saveData();


            renderHome();


            showToast(
                "数据导入成功"
            );


            event.target.value = "";


        } catch (error) {

            console.error(error);

            showToast(
                "导入失败：文件格式不正确"
            );

            event.target.value = "";

        }

    };


    reader.readAsText(file);

}


/* ============================================================
   Clear
============================================================ */

function clearAllData() {

    openModal(

        "清空全部数据",

        `
            <div style="
                color:#d93025;
                font-size:14px;
                line-height:1.7;
            ">

                ⚠️ 确定要清空所有消费申请和记录吗？

                <br><br>

                此操作无法撤销。

                <br><br>

                如果你有重要记录，请先导出数据。

            </div>
        `,

        () => {

            data = {

                expenses: [],

                categoryBudgets:
                    JSON.parse(
                        JSON.stringify(
                            DEFAULT_CATEGORY_BUDGETS
                        )
                    ),

                totalBudget:
                    JSON.parse(
                        JSON.stringify(
                            DEFAULT_TOTAL_BUDGET
                        )
                    )

            };


            saveData();


            closeModal();

            renderHome();

            showToast("所有数据已清空");

        }

    );

}


/* ============================================================
   Modal
============================================================ */

let modalCallback = null;


function openModal(
    title,
    content,
    callback
) {

    document.getElementById(
        "modalTitle"
    ).textContent = title;


    document.getElementById(
        "modalContent"
    ).innerHTML = content;


    modalCallback = callback;


    document.getElementById(
        "modalMask"
    ).classList.add("show");

}


function closeModal() {

    document.getElementById(
        "modalMask"
    ).classList.remove("show");


    modalCallback = null;

}


function confirmModal() {

    if (
        typeof modalCallback ===
        "function"
    ) {

        const callback =
            modalCallback;


        modalCallback = null;


        callback();

    }

}


/* ============================================================
   Toast
============================================================ */

let toastTimer = null;


function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add("show");


    clearTimeout(toastTimer);


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* ============================================================
   Helpers
============================================================ */

function formatMoney(number) {

    const n =
        Number(number) || 0;


    return n.toLocaleString(
        "zh-CN",
        {
            minimumFractionDigits:
                Number.isInteger(n)
                ? 0
                : 2,

            maximumFractionDigits: 2
        }
    );

}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function escapeJs(value) {

    return String(value ?? "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");

}


function emptyHtml(
    icon,
    text
) {

    return `

        <div class="empty">

            <div class="empty-icon">
                ${icon}
            </div>

            <div class="empty-text">
                ${text}
            </div>

        </div>

    `;

}


function getChoiceTitle(
    type,
    value
) {

    if (!value) return "未填写";


    const item =
        CHOICES[type].find(
            x => x.value === value
        );


    return item
        ? item.title
        : value;

}


/* ============================================================
   Detail page without changing nav
============================================================ */

function showPageWithoutNav(page) {

    document.querySelectorAll(".page")
        .forEach(el => {

            el.classList.remove("active");

        });


    const target =
        document.getElementById(
            `page-${page}`
        );


    if (target) {

        target.classList.add("active");

    }


    document.querySelectorAll(".nav button")
        .forEach(el => {

            el.classList.remove("active");

        });

}


/* ============================================================
   Initialization
============================================================ */

function initialize() {

    renderHome();

    initNewForm();

}


initialize();


/* ============================================================
   Prevent accidental modal close when clicking background
============================================================ */

document.getElementById(
    "modalMask"
).addEventListener(
    "click",
    function(e) {

        if (
            e.target === this
        ) {

            closeModal();

        }

    }
);
