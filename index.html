<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>个人消费 OA</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f5f7;
    color: #222;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        sans-serif;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    max-width: 600px;
    margin: auto;
    min-height: 100vh;
    padding-bottom: 80px;
}

.header {
    background: white;
    padding: 18px 18px 14px;
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 1px solid #eee;
}

.header-title {
    font-size: 24px;
    font-weight: 700;
}

.header-subtitle {
    color: #888;
    font-size: 13px;
    margin-top: 4px;
}

.page {
    padding: 15px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

.stat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.stat-card {
    background: white;
    border-radius: 14px;
    padding: 16px;
}

.stat-title {
    color: #888;
    font-size: 13px;
}

.stat-value {
    font-size: 24px;
    font-weight: 700;
    margin-top: 6px;
}

.section-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 12px;
}

label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
}

input,
select,
textarea {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 12px;
    background: white;
    outline: none;
    margin-bottom: 15px;
}

input:focus,
select:focus,
textarea:focus {
    border-color: #888;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

.btn {
    border: none;
    border-radius: 11px;
    padding: 12px 16px;
    background: #222;
    color: white;
    width: 100%;
    font-weight: 600;
}

.btn-secondary {
    background: #eee;
    color: #222;
}

.btn-danger {
    background: #e5484d;
}

.btn-success {
    background: #2f9e44;
}

.btn-warning {
    background: #f08c00;
}

.btn-small {
    width: auto;
    padding: 8px 12px;
    font-size: 13px;
}

/* ================================
   消费记录
================================ */

.expense-item {
    background: white;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 10px;
    cursor: pointer;
}

.expense-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.expense-name {
    font-weight: 700;
    font-size: 17px;
}

.expense-price {
    font-weight: 700;
    white-space: nowrap;
}

.expense-meta {
    color: #888;
    font-size: 13px;
    margin-top: 6px;
}

.badge {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 12px;
    margin-top: 10px;
    background: #eee;
}

.badge-pending {
    background: #fff3bf;
    color: #8a6500;
}

.badge-approved {
    background: #d3f9d8;
    color: #176b2c;
}

.badge-rejected {
    background: #ffe3e3;
    color: #a61e1e;
}

.badge-purchased {
    background: #dbe4ff;
    color: #364fc7;
}

.badge-refunded {
    background: #e9ecef;
    color: #495057;
}

/* 记录卡片里面的操作按钮 */
.expense-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

.expense-actions .btn {
    flex: 1;
    width: auto;
    min-width: 0;
}

/* ================================
   审批
================================ */

.progress {
    height: 8px;
    background: #eee;
    border-radius: 20px;
    overflow: hidden;
    margin: 12px 0;
}

.progress-bar {
    height: 100%;
    background: #333;
}

.step {
    border: 1px solid #eee;
    border-radius: 13px;
    padding: 15px;
    margin-bottom: 10px;
}

.step-current {
    border: 2px solid #333;
}

.step-done {
    background: #f8f8f8;
}

.step-number {
    font-size: 13px;
    color: #888;
}

.step-title {
    font-weight: 700;
    margin-top: 4px;
}

.option {
    display: block;
    background: #f5f5f5;
    border-radius: 10px;
    padding: 12px;
    margin: 8px 0;
    cursor: pointer;
}

.option input {
    width: auto;
    margin: 0 8px 0 0;
}

/* ================================
   预算
================================ */

.budget-row {
    margin-bottom: 20px;
}

.budget-name {
    font-weight: 700;
    margin-bottom: 8px;
}

.budget-info {
    font-size: 13px;
    color: #777;
    line-height: 1.7;
}

.budget-bar {
    height: 8px;
    background: #eee;
    border-radius: 20px;
    overflow: hidden;
    margin: 8px 0;
}

.budget-fill {
    height: 100%;
    background: #333;
}

/* ================================
   其他
================================ */

.empty {
    text-align: center;
    color: #999;
    padding: 30px 10px;
}

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    border-top: 1px solid #eee;
    display: flex;
    justify-content: center;
    z-index: 20;
}

.bottom-nav-inner {
    width: 100%;
    max-width: 600px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
}

.nav-btn {
    border: none;
    background: white;
    padding: 12px 5px;
    color: #777;
    font-size: 12px;
}

.nav-btn.active {
    color: #111;
    font-weight: 700;
}

.back-btn {
    margin-bottom: 12px;
}

.row {
    display: flex;
    gap: 8px;
}

.row > * {
    flex: 1;
}

.money {
    font-size: 30px;
    font-weight: 800;
}

.reason {
    white-space: pre-wrap;
    line-height: 1.6;
    color: #555;
}

.notice {
    background: #f5f5f5;
    padding: 12px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.6;
}

hr {
    border: none;
    border-top: 1px solid #eee;
    margin: 16px 0;
}

.hidden {
    display: none !important;
}

.small {
    font-size: 12px;
    color: #888;
}

.big-number {
    font-size: 32px;
    font-weight: 800;
}

@media (min-width: 601px) {

    .app {
        box-shadow: 0 0 30px rgba(0,0,0,0.05);
        background: #f5f5f7;
    }

}

</style>

</head>


<body>

<div class="app">

    <div class="header">

        <div class="header-title">
            个人消费 OA
        </div>

        <div class="header-subtitle">
            我的消费，先审批再购买
        </div>

    </div>

    <div id="app"></div>

</div>


<div class="bottom-nav">

    <div class="bottom-nav-inner">

        <button
            class="nav-btn active"
            onclick="showPage('home')">

            🏠<br>
            首页

        </button>

        <button
            class="nav-btn"
            onclick="showPage('pending')">

            ⏳<br>
            待审批

        </button>

        <button
            class="nav-btn"
            onclick="showPage('records')">

            📋<br>
            记录

        </button>

        <button
            class="nav-btn"
            onclick="showPage('settings')">

            ⚙️<br>
            设置

        </button>

    </div>

</div>


<script>

/* =====================================================
   基础数据
===================================================== */

const STORAGE_KEY =
    "personal_expense_oa_v1";


const DEFAULT_BUDGETS = {

    "电子产品": {
        monthly: 3000,
        yearly: 15000
    },

    "娱乐": {
        monthly: 1000,
        yearly: 5000
    },

    "衣服": {
        monthly: 1000,
        yearly: 5000
    },

    "食品": {
        monthly: 2000,
        yearly: 24000
    },

    "宠物": {
        monthly: 1000,
        yearly: 12000
    },

    "交通": {
        monthly: 1000,
        yearly: 12000
    },

    "旅行": {
        monthly: 3000,
        yearly: 20000
    },

    "家居": {
        monthly: 1000,
        yearly: 10000
    },

    "学习": {
        monthly: 500,
        yearly: 5000
    },

    "其他": {
        monthly: 1000,
        yearly: 10000
    }

};


const CATEGORIES =
    Object.keys(DEFAULT_BUDGETS);


const STEPS = [

    {
        title: "有用程度",
        question: "这个东西对我有多大用？",
        options: [
            "很有用",
            "有用",
            "一般",
            "没什么用"
        ]
    },

    {
        title: "使用频率",
        question: "预计会经常使用吗？",
        options: [
            "每天",
            "每周",
            "每月",
            "偶尔",
            "一次性"
        ]
    },

    {
        title: "已有替代品",
        question: "我现在是否已经有类似的东西？",
        options: [
            "没有",
            "有，但不能满足需求",
            "有，而且完全够用"
        ]
    },

    {
        title: "分类预算",
        question: "这次消费是否会造成预算压力？",
        options: [
            "预算充足",
            "接近预算上限",
            "超过预算"
        ]
    },

    {
        title: "价格合理性",
        question: "这个价格是否合理？",
        options: [
            "很便宜",
            "正常价格",
            "有点贵",
            "很贵"
        ]
    },

    {
        title: "最终决定",
        question: "综合考虑以后，我是否真的应该购买？",
        options: [
            "通过",
            "拒绝",
            "暂缓"
        ]
    }

];


/* =====================================================
   数据读取
===================================================== */

function loadData() {

    const saved =
        localStorage.getItem(STORAGE_KEY);

    if (!saved) {

        return {

            expenses: [],

            budgets:
                JSON.parse(
                    JSON.stringify(DEFAULT_BUDGETS)
                )

        };

    }

    try {

        const parsed =
            JSON.parse(saved);

        const budgets =
            parsed.budgets ||
            JSON.parse(
                JSON.stringify(DEFAULT_BUDGETS)
            );

        /* 给旧数据补充新分类预算 */
        CATEGORIES.forEach(category => {

            if (!budgets[category]) {

                budgets[category] =
                    JSON.parse(
                        JSON.stringify(
                            DEFAULT_BUDGETS[category]
                        )
                    );

            }

        });

        const expenses =
            Array.isArray(parsed.expenses)
            ? parsed.expenses
            : [];

        /*
         * 统一旧数据 ID 类型。
         * 这样以前的记录也可以继续操作。
         */
        expenses.forEach(expense => {

            if (
                expense.id !== undefined &&
                expense.id !== null
            ) {

                expense.id =
                    String(expense.id);

            }

            if (!Array.isArray(expense.approvals)) {

                expense.approvals = [];

            }

        });

        return {
            expenses,
            budgets
        };

    } catch (e) {

        return {

            expenses: [],

            budgets:
                JSON.parse(
                    JSON.stringify(DEFAULT_BUDGETS)
                )

        };

    }

}


let data =
    loadData();


function saveData() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

}


/* =====================================================
   工具函数
===================================================== */

function money(value) {

    return Number(value || 0).toLocaleString(
        "zh-CN",
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    );

}


function today() {

    const d = new Date();

    return (
        d.getFullYear() +
        "-" +
        String(d.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(d.getDate()).padStart(2, "0")
    );

}


function monthKey(dateString) {

    if (!dateString) return "";

    return dateString.slice(0, 7);

}


function currentMonth() {

    const d = new Date();

    return (
        d.getFullYear() +
        "-" +
        String(d.getMonth() + 1).padStart(2, "0")
    );

}


function currentYear() {

    return new Date()
        .getFullYear()
        .toString();

}


function escapeHtml(text) {

    if (
        text === undefined ||
        text === null
    ) {

        return "";

    }

    return String(text)

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function statusText(status) {

    const map = {

        pending: "审批中",

        approved: "已通过",

        rejected: "已拒绝",

        purchased: "已购买",

        refunded: "已退款"

    };

    return map[status] || status;

}


function statusClass(status) {

    return "badge badge-" + status;

}


/*
 * 统一 ID 查找
 * 解决旧数据 number / 新数据 string 的问题
 */
function findExpense(id) {

    return data.expenses.find(
        e => String(e.id) === String(id)
    );

}


/* =====================================================
   预算计算

   只有 purchased 才真正占用预算。

   pending / approved：
   不占用真实预算，只在详情页显示
   “如果购买以后”的剩余预算。

   refunded：
   不占用预算。
===================================================== */

function getCategorySpending(
    category,
    type
) {

    const nowMonth =
        currentMonth();

    const nowYear =
        currentYear();

    return data.expenses

        .filter(e =>
            e.category === category &&
            e.status === "purchased"
        )

        .filter(e => {

            const date =
                e.purchasedAt ||
                e.createdAt;

            if (!date) return false;

            if (type === "month") {

                return (
                    monthKey(date) === nowMonth
                );

            }

            return (
                date.slice(0, 4) === nowYear
            );

        })

        .reduce(
            (sum, e) =>
                sum + Number(e.price || 0),
            0
        );

}


function getBudgetInfo(
    category,
    price = 0,
    includeCurrent = false
) {

    const budget =
        data.budgets[category] || {
            monthly: 0,
            yearly: 0
        };

    const monthUsed =
        getCategorySpending(
            category,
            "month"
        );

    const yearUsed =
        getCategorySpending(
            category,
            "year"
        );

    const extra =
        includeCurrent
        ? Number(price || 0)
        : 0;

    return {

        monthly: budget.monthly,

        yearly: budget.yearly,

        monthUsed,

        yearUsed,

        monthRemaining:
            budget.monthly -
            monthUsed -
            extra,

        yearRemaining:
            budget.yearly -
            yearUsed -
            extra

    };

}


/* =====================================================
   首页
===================================================== */

function renderHome() {

    const month =
        currentMonth();

    const monthSpent =
        data.expenses

            .filter(e => {

                const date =
                    e.purchasedAt ||
                    e.createdAt;

                return (
                    date &&
                    monthKey(date) === month &&
                    e.status === "purchased"
                );

            })

            .reduce(
                (sum, e) =>
                    sum + Number(e.price || 0),
                0
            );

    const pending =
        data.expenses.filter(
            e => e.status === "pending"
        ).length;

    const approved =
        data.expenses.filter(
            e => e.status === "approved"
        ).length;

    const purchased =
        data.expenses.filter(
            e => e.status === "purchased"
        ).length;


    let html = `

        <div class="page">

            <div class="card">

                <div class="small">
                    本月已消费
                </div>

                <div class="big-number">
                    ¥${money(monthSpent)}
                </div>

            </div>


            <div class="stat-grid">

                <div class="stat-card">

                    <div class="stat-title">
                        待审批
                    </div>

                    <div class="stat-value">
                        ${pending}
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-title">
                        已通过
                    </div>

                    <div class="stat-value">
                        ${approved}
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-title">
                        已购买
                    </div>

                    <div class="stat-value">
                        ${purchased}
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-title">
                        总申请
                    </div>

                    <div class="stat-value">
                        ${data.expenses.length}
                    </div>

                </div>

            </div>


            <div style="height:14px"></div>


            <button
                class="btn"
                onclick="showNewExpense()">

                ＋ 新建消费申请

            </button>


            <div style="height:20px"></div>


            <div class="section-title">
                最近申请
            </div>

    `;


    const recent =
        [...data.expenses]

            .sort(
                (a,b) =>
                    Number(b.id) -
                    Number(a.id)
            )

            .slice(0,5);


    if (recent.length === 0) {

        html += `

            <div class="card empty">
                还没有消费申请
            </div>

        `;

    } else {

        recent.forEach(expense => {

            html += expenseCard(expense);

        });

    }


    html += `

        </div>

    `;


    document
        .getElementById("app")
        .innerHTML = html;

}


/* =====================================================
   消费卡片
===================================================== */

function expenseCard(expense) {

    const stepCount =
        STEPS.length;

    const completed =
        expense.approvals.length;

    const percent =
        Math.round(
            completed /
            stepCount *
            100
        );


    let actionHtml = "";


    /*
     * 待审批
     */
    if (expense.status === "pending") {

        actionHtml = `

            <div class="expense-actions">

                <button
                    class="btn btn-secondary"
                    onclick="event.stopPropagation(); showExpense('${escapeHtml(expense.id)}')">

                    继续审批

                </button>

            </div>

        `;

    }


    /*
     * 已通过
     */
    else if (expense.status === "approved") {

        actionHtml = `

            <div class="expense-actions">

                <button
                    class="btn btn-success"
                    onclick="event.stopPropagation(); markPurchased('${escapeHtml(expense.id)}')">

                    标记为已购买

                </button>

            </div>

        `;

    }


    /*
     * 已购买
     */
    else if (expense.status === "purchased") {

        actionHtml = `

            <div class="expense-actions">

                <button
                    class="btn btn-warning"
                    onclick="event.stopPropagation(); markRefunded('${escapeHtml(expense.id)}')">

                    ↩️ 标记退款

                </button>

            </div>

        `;

    }


    return `

        <div
            class="expense-item"
            onclick="showExpense('${escapeHtml(expense.id)}')"
        >

            <div class="expense-top">

                <div>

                    <div class="expense-name">

                        ${escapeHtml(expense.name)}

                    </div>


                    <div class="expense-meta">

                        ${escapeHtml(expense.category)}

                        ·

                        ${escapeHtml(
                            expense.createdAt
                            ? expense.createdAt.slice(0,10)
                            : ""
                        )}

                    </div>

                </div>


                <div class="expense-price">

                    ¥${money(expense.price)}

                </div>

            </div>


            <span
                class="${statusClass(expense.status)}">

                ${statusText(expense.status)}

            </span>


            ${
                expense.status === "pending"

                ?

                `

                <div class="progress">

                    <div
                        class="progress-bar"
                        style="width:${percent}%">
                    </div>

                </div>


                <div class="small">

                    审批进度
                    ${completed}/${stepCount}

                </div>

                `

                :

                ""

            }


            ${actionHtml}

        </div>

    `;

}


/* =====================================================
   新建申请
===================================================== */

function showNewExpense() {

    let html = `

        <div class="page">

            <button
                class="btn btn-secondary back-btn"
                onclick="showPage('home')">

                ← 返回

            </button>


            <div class="card">

                <div class="section-title">
                    新建消费申请
                </div>


                <label>
                    商品 / 消费名称
                </label>

                <input
                    id="new-name"
                    type="text"
                    placeholder="例如：Sony 耳机"
                >


                <label>
                    价格
                </label>

                <input
                    id="new-price"
                    type="number"
                    step="0.01"
                    min="0"
                    placeholder="0.00"
                >


                <label>
                    分类
                </label>

                <select id="new-category">

                    ${CATEGORIES.map(c =>
                        `<option value="${c}">${c}</option>`
                    ).join("")}

                </select>


                <label>
                    申请理由
                </label>

                <textarea
                    id="new-reason"
                    placeholder="为什么想买？现在为什么需要？"
                ></textarea>


                <button
                    class="btn"
                    onclick="createExpense()">

                    提交申请

                </button>

            </div>

        </div>

    `;


    document
        .getElementById("app")
        .innerHTML = html;

}


function createExpense() {

    const name =
        document
            .getElementById("new-name")
            .value
            .trim();

    const price =
        Number(
            document
                .getElementById("new-price")
                .value
        );

    const category =
        document
            .getElementById("new-category")
            .value;

    const reason =
        document
            .getElementById("new-reason")
            .value
            .trim();


    if (!name) {

        alert("请输入商品名称");

        return;

    }


    if (!price || price <= 0) {

        alert("请输入正确的价格");

        return;

    }


    const expense = {

        id: String(Date.now()),

        name,

        price,

        category,

        reason,

        status: "pending",

        currentStep: 0,

        createdAt:
            new Date().toISOString(),

        approvals: []

    };


    data.expenses.push(expense);

    saveData();

    showExpense(expense.id);

}


/* =====================================================
   消费详情
===================================================== */

function showExpense(id) {

    const expense =
        findExpense(id);


    if (!expense) {

        alert("找不到这个申请");

        return;

    }


    let html = `

        <div class="page">

            <button
                class="btn btn-secondary back-btn"
                onclick="showPage('records')">

                ← 返回

            </button>


            <div class="card">

                <div class="expense-name">

                    ${escapeHtml(expense.name)}

                </div>


                <div class="money">

                    ¥${money(expense.price)}

                </div>


                <div class="expense-meta">

                    ${escapeHtml(expense.category)}

                    ·

                    ${expense.createdAt
                        ? escapeHtml(
                            expense.createdAt.slice(0,10)
                        )
                        : ""
                    }

                </div>


                <span
                    class="${statusClass(expense.status)}">

                    ${statusText(expense.status)}

                </span>


                <hr>


                <div class="small">
                    申请理由
                </div>


                <div class="reason">

                    ${
                        escapeHtml(expense.reason)
                        || "未填写"
                    }

                </div>

            </div>

    `;


    /*
     * 预算显示
     */

    const isPurchased =
        expense.status === "purchased";

    const isRefunded =
        expense.status === "refunded";


    const budget =
        getBudgetInfo(
            expense.category,
            expense.price,
            !isPurchased && !isRefunded
        );


    html += `

        <div class="card">

            <div class="section-title">

                当前预算

            </div>


            <div class="budget-info">

                月预算：
                ¥${money(budget.monthly)}

                <br>

                本月已用：
                ¥${money(budget.monthUsed)}

                <br>

                ${
                    isPurchased

                    ? "购买后剩余："

                    : isRefunded

                    ? "退款后剩余："

                    : "本次申请后剩余："
                }

                <strong>

                    ¥${money(budget.monthRemaining)}

                </strong>


                <br><br>


                年预算：
                ¥${money(budget.yearly)}

                <br>

                本年已用：
                ¥${money(budget.yearUsed)}

                <br>

                ${
                    isPurchased

                    ? "购买后剩余："

                    : isRefunded

                    ? "退款后剩余："

                    : "本次申请后剩余："
                }

                <strong>

                    ¥${money(budget.yearRemaining)}

                </strong>

            </div>


            ${
                isRefunded

                ?

                `

                <div style="height:12px"></div>

                <div class="notice">

                    此记录已经退款。

                    <br>

                    ¥${money(expense.price)}
                    已从预算中释放。

                    ${
                        expense.refundedAt
                        ?
                        `<br>
                         退款时间：
                         ${escapeHtml(
                            expense.refundedAt
                                .slice(0,10)
                         )}`
                        :
                        ""
                    }

                </div>

                `

                :

                ""

            }

        </div>

    `;


    /*
     * 审批流程
     */

    html += `

        <div class="card">

            <div class="section-title">

                审批流程

            </div>

    `;


    STEPS.forEach(
        (step, index) => {

            const approval =
                expense.approvals.find(
                    a =>
                        a.step === index
                );


            if (approval) {

                html += `

                    <div class="step step-done">

                        <div class="step-number">

                            第 ${index + 1} 节点

                        </div>


                        <div class="step-title">

                            ${step.title}

                        </div>


                        <p>

                            ✅
                            ${escapeHtml(
                                approval.answer
                            )}

                        </p>


                        ${
                            approval.comment

                            ?

                            `

                            <div class="small">

                                备注：
                                ${escapeHtml(
                                    approval.comment
                                )}

                            </div>

                            `

                            :

                            ""

                        }

                    </div>

                `;

                return;

            }


            if (
                expense.status === "pending" &&
                index === expense.currentStep
            ) {

                html += `

                    <div
                        class="step step-current">

                        <div class="step-number">

                            第 ${index + 1} 节点

                        </div>


                        <div class="step-title">

                            ${step.title}

                        </div>


                        <p>

                            ${step.question}

                        </p>


                        <form
                            onsubmit="
                                submitApproval(
                                    event,
                                    '${escapeHtml(expense.id)}',
                                    ${index}
                                )
                            "
                        >

                `;


                step.options.forEach(
                    option => {

                        html += `

                            <label class="option">

                                <input
                                    type="radio"
                                    name="answer"
                                    value="${escapeHtml(option)}"
                                    required
                                >

                                ${escapeHtml(option)}

                            </label>

                        `;

                    }
                );


                html += `

                            <textarea
                                name="comment"
                                placeholder="备注（可选）"
                            ></textarea>


                            <button
                                class="btn"
                                type="submit">

                                提交此节点

                            </button>


                        </form>

                    </div>

                `;

            }

            else {

                html += `

                    <div class="step">

                        <div class="step-number">

                            第 ${index + 1} 节点

                        </div>


                        <div class="step-title">

                            ${step.title}

                        </div>


                        <div class="small">

                            ⏳ 等待前面的节点

                        </div>

                    </div>

                `;

            }

        }
    );


    html += `

        </div>

    `;


    /*
     * 已通过
     */

    if (expense.status === "approved") {

        html += `

            <div class="card">

                <div class="section-title">

                    🎉 审批通过

                </div>


                <p>

                    这个消费已经通过所有审批节点。

                </p>


                <button
                    class="btn btn-success"
                    onclick="
                        markPurchased(
                            '${escapeHtml(expense.id)}'
                        )
                    ">

                    标记为已购买

                </button>

            </div>

        `;

    }


    /*
     * 已购买
     */

    if (expense.status === "purchased") {

        html += `

            <div class="card">

                <div class="section-title">

                    🛒 已购买

                </div>


                <p>

                    此消费已经购买。

                    <br>

                    预算目前计入本月 / 本年消费。

                </p>


                ${
                    expense.purchasedAt

                    ?

                    `<div class="small">

                        购买时间：
                        ${escapeHtml(
                            expense.purchasedAt
                                .slice(0,10)
                        )}

                    </div>`

                    :

                    ""

                }


                <div style="height:12px"></div>


                <button
                    class="btn btn-warning"
                    onclick="
                        markRefunded(
                            '${escapeHtml(expense.id)}'
                        )
                    ">

                    ↩️ 标记为已退款

                </button>

            </div>

        `;

    }


    /*
     * 已退款
     */

    if (expense.status === "refunded") {

        html += `

            <div class="card">

                <div class="section-title">

                    ↩️ 已退款

                </div>


                <p>

                    这条消费记录仍然保留，
                    但 ¥${money(expense.price)}
                    已经释放，不再占用预算。

                </p>


                ${
                    expense.purchasedAt

                    ?

                    `<div class="small">

                        原购买时间：
                        ${escapeHtml(
                            expense.purchasedAt
                                .slice(0,10)
                        )}

                    </div>`

                    :

                    ""

                }


                ${
                    expense.refundedAt

                    ?

                    `<div class="small">

                        退款时间：
                        ${escapeHtml(
                            expense.refundedAt
                                .slice(0,10)
                        )}

                    </div>`

                    :

                    ""

                }

            </div>

        `;

    }


    /*
     * 已拒绝
     */

    if (expense.status === "rejected") {

        html += `

            <div class="card">

                <div class="section-title">

                    ❌ 已拒绝

                </div>


                <p>

                    这个消费没有通过最终审批。

                </p>

            </div>

        `;

    }


    html += `

        </div>

    `;


    document
        .getElementById("app")
        .innerHTML = html;

}


/* =====================================================
   审批
===================================================== */

function submitApproval(
    event,
    expenseId,
    stepIndex
) {

    event.preventDefault();


    const form =
        event.target;


    const checked =
        form.querySelector(
            'input[name="answer"]:checked'
        );


    if (!checked) {

        return;

    }


    const answer =
        checked.value;


    const comment =
        form.querySelector(
            'textarea[name="comment"]'
        )
        .value
        .trim();


    const expense =
        findExpense(expenseId);


    if (!expense) {

        return;

    }


    expense.approvals.push({

        step: stepIndex,

        answer,

        comment,

        createdAt:
            new Date().toISOString()

    });


    if (
        stepIndex ===
        STEPS.length - 1
    ) {

        if (answer === "通过") {

            expense.status =
                "approved";

        }

        else if (
            answer === "拒绝"
        ) {

            expense.status =
                "rejected";

        }

        else {

            /*
             * 暂缓：
             * 删除本次最终决定记录，
             * 保留在最终节点。
             */

            expense.status =
                "pending";

            expense.currentStep =
                stepIndex;


            expense.approvals =
                expense.approvals.filter(
                    a =>
                        a.step !== stepIndex
                );

        }

    }

    else {

        expense.currentStep =
            stepIndex + 1;

    }


    saveData();

    showExpense(expenseId);

}


/* =====================================================
   标记购买
===================================================== */

function markPurchased(id) {

    const expense =
        findExpense(id);


    if (!expense) {

        alert("找不到这条记录");

        return;

    }


    if (
        expense.status !==
        "approved"
    ) {

        alert(
            "只有已通过的记录才能标记为已购买"
        );

        return;

    }


    if (
        !confirm(
            "确定已经购买这个东西了吗？"
        )
    ) {

        return;

    }


    expense.status =
        "purchased";


    expense.purchasedAt =
        new Date().toISOString();


    /*
     * 如果历史数据曾经有 refundedAt，
     * 重新购买时清除。
     */

    delete expense.refundedAt;


    saveData();

    showExpense(id);

}


/* =====================================================
   标记退款
===================================================== */

function markRefunded(id) {

    const expense =
        findExpense(id);


    if (!expense) {

        alert("找不到这条记录");

        return;

    }


    if (
        expense.status !==
        "purchased"
    ) {

        alert(
            "只有已购买的记录才能标记为已退款"
        );

        return;

    }


    if (
        !confirm(
            "确定这笔消费已经退款了吗？\n\n" +
            "退款后，这笔钱将立即从当前预算中释放。"
        )
    ) {

        return;

    }


    expense.status =
        "refunded";


    expense.refundedAt =
        new Date().toISOString();


    /*
     * purchasedAt 不删除。
     * 这样以后仍然知道什么时候买的。
     */


    saveData();


    alert(
        "已退款，¥" +
        money(expense.price) +
        " 预算已释放"
    );


    showExpense(id);

}


/* =====================================================
   待审批
===================================================== */

function renderPending() {

    const pending =
        data.expenses

            .filter(
                e =>
                    e.status ===
                    "pending"
            )

            .sort(
                (a,b) =>
                    Number(b.id) -
                    Number(a.id)
            );


    let html = `

        <div class="page">

            <div class="section-title">

                待审批

            </div>

    `;


    if (pending.length === 0) {

        html += `

            <div class="card empty">

                🎉 没有待审批项目

            </div>

        `;

    }

    else {

        pending.forEach(
            expense => {

                html +=
                    expenseCard(expense);

            }
        );

    }


    html += `

        </div>

    `;


    document
        .getElementById("app")
        .innerHTML = html;

}


/* =====================================================
   消费记录
===================================================== */

function renderRecords() {

    const list =
        [...data.expenses]

            .sort(
                (a,b) =>
                    Number(b.id) -
                    Number(a.id)
            );


    let html = `

        <div class="page">

            <div class="section-title">

                消费记录

            </div>

    `;


    if (list.length === 0) {

        html += `

            <div class="card empty">

                还没有记录

            </div>

        `;

    }

    else {

        list.forEach(
            expense => {

                html +=
                    expenseCard(expense);

            }
        );

    }


    html += `

        </div>

    `;


    document
        .getElementById("app")
        .innerHTML = html;

}


/* =====================================================
   设置 / 预算
===================================================== */

function renderSettings() {

    let html = `

        <div class="page">

            <div class="section-title">

                分类预算

            </div>

    `;


    CATEGORIES.forEach(
        category => {

            const budget =
                data.budgets[category];


            const used =
                getCategorySpending(
                    category,
                    "month"
                );


            const percent =
                budget.monthly > 0

                ?

                Math.min(
                    100,
                    Math.round(
                        used /
                        budget.monthly *
                        100
                    )
                )

                :

                0;


            html += `

                <div class="card budget-row">

                    <div class="budget-name">

                        ${escapeHtml(category)}

                    </div>


                    <div class="budget-info">

                        本月：

                        ¥${money(used)}

                        /

                        ¥${money(budget.monthly)}


                        <div class="budget-bar">

                            <div
                                class="budget-fill"
                                style="width:${percent}%">
                            </div>

                        </div>


                        年度预算：

                        ¥${money(budget.yearly)}

                    </div>


                    <hr>


                    <label>
                        每月预算
                    </label>


                    <input
                        type="number"
                        step="0.01"
                        value="${budget.monthly}"
                        id="monthly-${escapeHtml(category)}"
                    >


                    <label>
                        每年预算
                    </label>


                    <input
                        type="number"
                        step="0.01"
                        value="${budget.yearly}"
                        id="yearly-${escapeHtml(category)}"
                    >


                    <button
                        class="btn btn-secondary"
                        onclick="
                            saveBudget(
                                '${escapeHtml(category)}'
                            )
                        ">

                        保存预算

                    </button>

                </div>

            `;

        }
    );


    html += `

        <div class="section-title">

            数据管理

        </div>


        <div class="card">

            <button
                class="btn"
                onclick="exportData()">

                导出数据

            </button>


            <div style="height:10px"></div>


            <label
                class="btn btn-secondary"
                style="
                    text-align:center;
                    cursor:pointer
                ">

                导入数据


                <input
                    type="file"
                    accept=".json"
                    onchange="importData(event)"
                    style="display:none"
                >

            </label>


            <div style="height:10px"></div>


            <button
                class="btn btn-danger"
                onclick="clearAllData()">

                清空所有数据

            </button>


            <div style="height:12px"></div>


            <div class="notice">

                数据默认保存在当前手机浏览器中。

                <br>

                建议偶尔点击“导出数据”
                保存一个备份文件。

            </div>

        </div>

    </div>

    `;


    document
        .getElementById("app")
        .innerHTML = html;

}


function saveBudget(category) {

    const monthly =
        Number(
            document
                .getElementById(
                    "monthly-" + category
                )
                .value
        );


    const yearly =
        Number(
            document
                .getElementById(
                    "yearly-" + category
                )
                .value
        );


    if (
        monthly < 0 ||
        yearly < 0 ||
        isNaN(monthly) ||
        isNaN(yearly)
    ) {

        alert("请输入正确的预算");

        return;

    }


    data.budgets[category] = {

        monthly,

        yearly

    };


    saveData();


    alert("预算已保存");


    renderSettings();

}


/* =====================================================
   数据导出
===================================================== */

function exportData() {

    const json =
        JSON.stringify(
            data,
            null,
            2
        );


    const blob =
        new Blob(
            [json],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");


    a.href = url;


    a.download =
        "personal-expense-backup-" +
        today() +
        ".json";


    a.click();


    URL.revokeObjectURL(url);

}


/* =====================================================
   数据导入
===================================================== */

function importData(event) {

    const file =
        event.target.files[0];


    if (!file) {

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(e) {

            try {

                const imported =
                    JSON.parse(
                        e.target.result
                    );


                if (
                    !imported.expenses ||
                    !imported.budgets
                ) {

                    throw new Error();

                }


                if (
                    !confirm(
                        "导入数据会覆盖当前数据，确定继续吗？"
                    )
                ) {

                    return;

                }


                /*
                 * 导入时也统一旧 ID。
                 */

                imported.expenses.forEach(
                    expense => {

                        if (
                            expense.id !== undefined &&
                            expense.id !== null
                        ) {

                            expense.id =
                                String(expense.id);

                        }

                        if (
                            !Array.isArray(
                                expense.approvals
                            )
                        ) {

                            expense.approvals = [];

                        }

                    }
                );


                data =
                    imported;


                saveData();


                alert(
                    "数据导入成功"
                );


                renderSettings();

            }

            catch (error) {

                alert(
                    "数据文件无效"
                );

            }

        };


    reader.readAsText(file);

}


/* =====================================================
   清空数据
===================================================== */

function clearAllData() {

    if (
        !confirm(
            "确定要删除全部消费记录吗？"
        )
    ) {

        return;

    }


    if (
        !confirm(
            "再次确认：所有申请和审批记录都会消失。"
        )
    ) {

        return;

    }


    data.expenses = [];


    saveData();


    alert(
        "数据已经清空"
    );


    renderSettings();

}


/* =====================================================
   页面切换
===================================================== */

function showPage(page) {

    document
        .querySelectorAll(".nav-btn")
        .forEach(
            btn =>
                btn.classList.remove(
                    "active"
                )
        );


    if (page === "home") {

        document
            .querySelectorAll(".nav-btn")[0]
            .classList.add("active");


        renderHome();

    }

    else if (page === "pending") {

        document
            .querySelectorAll(".nav-btn")[1]
            .classList.add("active");


        renderPending();

    }

    else if (page === "records") {

        document
            .querySelectorAll(".nav-btn")[2]
            .classList.add("active");


        renderRecords();

    }

    else if (page === "settings") {

        document
            .querySelectorAll(".nav-btn")[3]
            .classList.add("active");


        renderSettings();

    }

}


/* =====================================================
   启动
===================================================== */

renderHome();

</script>
