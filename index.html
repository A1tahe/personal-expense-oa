<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>个人消费 OA</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f5f7;
    color: #222;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        sans-serif;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    max-width: 600px;
    margin: auto;
    min-height: 100vh;
    padding-bottom: 80px;
}

.header {
    background: white;
    padding: 18px 18px 14px;
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 1px solid #eee;
}

.header-title {
    font-size: 24px;
    font-weight: 700;
}

.header-subtitle {
    color: #888;
    font-size: 13px;
    margin-top: 4px;
}

.page {
    padding: 15px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

.stat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.stat-card {
    background: white;
    border-radius: 14px;
    padding: 16px;
}

.stat-title {
    color: #888;
    font-size: 13px;
}

.stat-value {
    font-size: 24px;
    font-weight: 700;
    margin-top: 6px;
}

.section-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 12px;
}

label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
}

input,
select,
textarea {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 12px;
    background: white;
    outline: none;
    margin-bottom: 15px;
}

input:focus,
select:focus,
textarea:focus {
    border-color: #888;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

.btn {
    border: none;
    border-radius: 11px;
    padding: 12px 16px;
    background: #222;
    color: white;
    width: 100%;
    font-weight: 600;
}

.btn-secondary {
    background: #eee;
    color: #222;
}

.btn-danger {
    background: #e5484d;
}

.btn-success {
    background: #2f9e44;
}

.btn-warning {
    background: #f08c00;
}

.btn-small {
    width: auto;
    padding: 8px 12px;
    font-size: 13px;
}

.expense-item {
    background: white;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 10px;
}

.expense-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.expense-name {
    font-weight: 700;
    font-size: 17px;
}

.expense-price {
    font-weight: 700;
    white-space: nowrap;
}

.expense-meta {
    color: #888;
    font-size: 13px;
    margin-top: 6px;
}

.badge {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 12px;
    margin-top: 10px;

}

.badge-pending {
    background: #fff3bf;
    color: #8a6500;
}

.badge-approved {
    background: #d3f9d8;
    color: #176b2c;
}

.badge-rejected {
    background: #ffe3e3;
    color: #a61e1e;
}

.badge-purchased {
    background: #dbe4ff;
    color: #364fc7;
}

.progress {
    height: 8px;
    background: #eee;
    border-radius: 20px;
    overflow: hidden;
    margin: 12px 0;
}

.progress-bar {
    height: 100%;
    background: #333;
}

.step {
    border: 1px solid #eee;
    border-radius: 13px;
    padding: 15px;
    margin-bottom: 10px;
}

.step-current {
    border: 2px solid #333;
}

.step-done {
    background: #f8f8f8;
}

.step-number {
    font-size: 13px;
    color: #888;
}

.step-title {
    font-weight: 700;
    margin-top: 4px;
}

.option {
    display: block;
    background: #f5f5f5;
    border-radius: 10px;
    padding: 12px;

    cursor: pointer;
}

.option input {
    width: auto;
    margin: 0 8px 0 0;
}

.budget-row {
    margin-bottom: 20px;
}

.budget-name {
    font-weight: 700;
    margin-bottom: 8px;
}

.budget-info {
    font-size: 13px;
    color: #777;
    line-height: 1.7;
}

.budget-bar {
    height: 8px;
    background: #eee;
    border-radius: 20px;
    overflow: hidden;
    margin: 8px 0;
}

.budget-fill {
    height: 100%;
    background: #333;
}

.budget-warning {
    color: #d9480f;
    font-weight: 700;
}

.budget-danger {
    color: #c92a2a;
    font-weight: 700;
}

.empty {
    text-align: center;
    color: #999;
    padding: 30px 10px;
}

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    border-top: 1px solid #eee;
    display: flex;
    justify-content: center;
    z-index: 20;
}

.bottom-nav-inner {
    width: 100%;
    max-width: 600px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
}

.nav-btn {
    border: none;
    background: white;
    padding: 12px 5px;
    color: #777;
    font-size: 12px;
}

.nav-btn.active {
    color: #111;
    font-weight: 700;
}

.back-btn {
    margin-bottom: 12px;
}

.row {
    display: flex;
    gap: 8px;
}

.row > * {
    flex: 1;
}

.money {
    font-size: 30px;
    font-weight: 800;
}

.reason {
    white-space: pre-wrap;
    line-height: 1.6;
    color: #555;
}

.notice {
    background: #f5f5f5;
    padding: 12px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.6;
}

hr {
    border: none;
    border-top: 1px solid #eee;
    margin: 16px 0;
}

.hidden {
    display: none !important;
}

.small {
    font-size: 12px;
    color: #888;
}

.big-number {
    font-size: 32px;
    font-weight: 800;
}

.total-budget-card {
    position: relative;
}

.budget-percent {
    font-size: 12px;
    color: #888;
    text-align: right;
    margin-top: 4px;
}

.remaining-positive {
    color: #176b2c;
    font-weight: 700;
}

.remaining-warning {
    color: #d9480f;
    font-weight: 700;
}

.remaining-negative {
    color: #c92a2a;
    font-weight: 700;
}

@media (min-width: 601px) {

    .app {
        box-shadow: 0 0 30px rgba(0,0,0,0.05);
        background: #f5f5f7;
    }

}

</style>
</head>

<body>

<div class="app">

<div class="header">

    <div class="header-title">
        个人消费 OA
    </div>

    <div class="header-subtitle">
        我的消费，先审批再购买
    </div>

</div>

<div id="app"></div>

</div>


<div class="bottom-nav">

<div class="bottom-nav-inner">

<button
    class="nav-btn active"
    onclick="showPage('home')">

    🏠<br>首页

</button>


<button
    class="nav-btn"
    onclick="showPage('pending')">

    ⏳<br>待审批

</button>


<button
    class="nav-btn"
    onclick="showPage('records')">

    📋<br>记录

</button>


<button
    class="nav-btn"
    onclick="showPage('settings')">

    ⚙️<br>设置

</button>

</div>

</div>


<script>

/* =====================================================
   基础数据
===================================================== */

const STORAGE_KEY =
    "personal_expense_oa_v1";


/*
 * 总预算
 *
 * 可以直接在“设置”里修改。
 *
 * 默认：
 * 每月 5000
 * 每年 60000
 */

const DEFAULT_TOTAL_BUDGET = {

    monthly: 5000,

    yearly: 60000

};


const DEFAULT_BUDGETS = {

    "电子产品": {
        monthly: 3000,
        yearly: 15000
    },

    "娱乐": {
        monthly: 1000,
        yearly: 5000
    },

    "衣服": {
        monthly: 1000,
        yearly: 5000
    },

    "食品": {
        monthly: 2000,
        yearly: 24000
    },

    "宠物": {
        monthly: 1000,
        yearly: 12000
    },

    "交通": {
        monthly: 1000,
        yearly: 12000
    },

    "旅行": {
        monthly: 3000,
        yearly: 20000
    },

    "家居": {
        monthly: 1000,
        yearly: 10000
    },

    "学习": {
        monthly: 500,
        yearly: 5000
    },

    "其他": {
        monthly: 1000,
        yearly: 10000
    }

};


const CATEGORIES =
    Object.keys(DEFAULT_BUDGETS);


const STEPS = [

    {

        title: "有用程度",

        question:
            "这个东西对我有多大用？",

        options: [
            "很有用",
            "有用",
            "一般",
            "没什么用"
        ]

    },

    {

        title: "使用频率",

        question:
            "预计会经常使用吗？",

        options: [
            "每天",
            "每周",
            "每月",
            "偶尔",
            "一次性"
        ]

    },

    {

        title: "已有替代品",

        question:
            "我现在是否已经有类似的东西？",

        options: [
            "没有",
            "有，但不能满足需求",
            "有，而且完全够用"
        ]

    },

    {

        title: "分类预算",

        question:
            "这次消费是否会造成预算压力？",

        options: [
            "预算充足",
            "接近预算上限",
            "超过预算"
        ]

    },

    {

        title: "价格合理性",

        question:
            "这个价格是否合理？",

        options: [
            "很便宜",
            "正常价格",
            "有点贵",
            "很贵"
        ]

    },

    {

        title: "最终决定",

        question:
            "综合考虑以后，我是否真的应该购买？",

        options: [
            "通过",
            "拒绝",
            "暂缓"
        ]

    }

];


/* =====================================================
   数据读取
===================================================== */

function loadData() {

    const saved =
        localStorage.getItem(STORAGE_KEY);


    if (!saved) {

        return {

            expenses: [],

            budgets:
                JSON.parse(
                    JSON.stringify(DEFAULT_BUDGETS)
                ),

            totalBudget:
                JSON.parse(
                    JSON.stringify(DEFAULT_TOTAL_BUDGET)
                )

        };

    }


    try {

        const data =
            JSON.parse(saved);


        return {

            expenses:
                data.expenses || [],

            budgets:
                data.budgets ||
                JSON.parse(
                    JSON.stringify(DEFAULT_BUDGETS)
                ),

            totalBudget:
                data.totalBudget ||
                JSON.parse(
                    JSON.stringify(DEFAULT_TOTAL_BUDGET)
                )

        };

    } catch (e) {

        return {

            expenses: [],

            budgets:
                JSON.parse(
                    JSON.stringify(DEFAULT_BUDGETS)
                ),

            totalBudget:
                JSON.parse(
                    JSON.stringify(DEFAULT_TOTAL_BUDGET)
                )

        };

    }

}


let data =
    loadData();


function saveData() {

    localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify(data)

    );

}


/* =====================================================
   工具函数
===================================================== */

function money(value) {

    return Number(
        value || 0
    ).toLocaleString(

        "zh-CN",

        {

            minimumFractionDigits: 2,

            maximumFractionDigits: 2

        }

    );

}


/*
 * 使用手机本地时间。
 *
 * 不使用 toISOString，
 * 避免 UTC 导致日期跨天问题。
 */

function today() {

    const d =
        new Date();

    const year =
        d.getFullYear();

    const month =
        String(
            d.getMonth() + 1
        ).padStart(2,"0");

    const day =
        String(
            d.getDate()
        ).padStart(2,"0");

    return `${year}-${month}-${day}`;

}


function currentMonth() {

    const d =
        new Date();

    const year =
        d.getFullYear();

    const month =
        String(
            d.getMonth() + 1
        ).padStart(2,"0");

    return `${year}-${month}`;

}


function currentYear() {

    return new Date()
        .getFullYear()
        .toString();

}


function escapeHtml(text) {

    if (
        text === undefined ||
        text === null
    ) {

        return "";

    }


    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function statusText(status) {

    const map = {

        pending: "审批中",

        approved: "已通过",

        rejected: "已拒绝",

        purchased: "已购买"

    };


    return map[status] || status;

}


function statusClass(status) {

    return "badge badge-" + status;

}


/* =====================================================
   分类预算计算
===================================================== */

function getCategorySpending(
    category,
    type
) {

    const nowMonth =
        currentMonth();

    const nowYear =
        currentYear();


    return data.expenses

        .filter(e =>

            e.category === category &&

            e.status === "purchased"

        )

        .filter(e => {

            if (
                type === "month"
            ) {

                return (
                    monthKey(
                        e.purchasedAt ||
                        e.createdAt
                    ) === nowMonth
                );

            }


            return (
                (
                    e.purchasedAt ||
                    e.createdAt
                ).slice(0,4)
                === nowYear
            );

        })

        .reduce(

            (sum,e) =>
                sum + Number(e.price),

            0

        );

}


function getBudgetInfo(
    category,
    price = 0
) {

    const budget =
        data.budgets[category] ||
        {
            monthly: 0,
            yearly: 0
        };


    const monthUsed =
        getCategorySpending(
            category,
            "month"
        );


    const yearUsed =
        getCategorySpending(
            category,
            "year"
        );


    const monthRemaining =
        budget.monthly -
        monthUsed -
        Number(price);


    const yearRemaining =
        budget.yearly -
        yearUsed -
        Number(price);


    return {

        monthly:
            budget.monthly,

        yearly:
            budget.yearly,

        monthUsed,

        yearUsed,

        monthRemaining,

        yearRemaining

    };

}


function monthKey(dateString) {

    if (!dateString) {

        return "";

    }

    return dateString.slice(
        0,
        7
    );

}


/* =====================================================
   总预算计算
===================================================== */

function getTotalBudgetInfo(
    price = 0
) {

    const month =
        currentMonth();

    const year =
        currentYear();


    /*
     * 只有已经购买的东西
     * 才算真正消费。
     */

    const monthUsed =
        data.expenses

            .filter(e =>

                (
                    e.purchasedAt ||
                    e.createdAt
                ).slice(0,7)
                === month &&

                e.status === "purchased"

            )

            .reduce(

                (sum,e) =>
                    sum + Number(e.price),

                0

            );


    const yearUsed =
        data.expenses

            .filter(e =>

                (
                    e.purchasedAt ||
                    e.createdAt
                ).slice(0,4)
                === year &&

                e.status === "purchased"

            )

            .reduce(

                (sum,e) =>
                    sum + Number(e.price),

                0

            );


    const monthlyBudget =
        Number(
            data.totalBudget?.monthly || 0
        );


    const yearlyBudget =
        Number(
            data.totalBudget?.yearly || 0
        );


    return {

        monthly:
            monthlyBudget,

        yearly:
            yearlyBudget,

        monthUsed,

        yearUsed,

        monthRemaining:
            monthlyBudget -
            monthUsed -
            Number(price),

        yearRemaining:
            yearlyBudget -
            yearUsed -
            Number(price)

    };

}


/* =====================================================
   预算状态
===================================================== */

function remainingClass(
    remaining,
    budget
) {

    if (
        remaining < 0
    ) {

        return "remaining-negative";

    }


    if (
        budget > 0 &&
        remaining <= budget * 0.2
    ) {

        return "remaining-warning";

    }


    return "remaining-positive";

}


/* =====================================================
   首页
===================================================== */

function renderHome() {

    const totalBudget =
        getTotalBudgetInfo();


    const pending =
        data.expenses

            .filter(
                e =>
                    e.status === "pending"
            )

            .length;


    const approved =
        data.expenses

            .filter(
                e =>
                    e.status === "approved"
            )

            .length;


    const purchased =
        data.expenses

            .filter(
                e =>
                    e.status === "purchased"
            )

            .length;


    const monthPercent =
        totalBudget.monthly > 0

        ?

        Math.min(

            100,

            Math.round(

                totalBudget.monthUsed /
                totalBudget.monthly *
                100

            )

        )

        :

        0;


    const yearPercent =
        totalBudget.yearly > 0

        ?

        Math.min(

            100,

            Math.round(

                totalBudget.yearUsed /
                totalBudget.yearly *
                100

            )

        )

        :

        0;


    const monthRemainingClass =
        remainingClass(

            totalBudget.monthRemaining,

            totalBudget.monthly

        );


    const yearRemainingClass =
        remainingClass(

            totalBudget.yearRemaining,

            totalBudget.yearly

        );


    let html = `

        <div class="page">


            <!-- =========================
                 本月总预算
            ========================== -->

            <div class="card total-budget-card">

                <div class="small">
                    本月预算
                </div>


                <div class="big-number">
                    ¥${money(
                        totalBudget.monthUsed
                    )}
                </div>


                <div class="budget-info">

                    已消费 /
                    ¥${money(
                        totalBudget.monthly
                    )}
                    总预算

                </div>


                <div class="budget-bar">

                    <div
                        class="budget-fill"
                        style="
                            width:${monthPercent}%;
                        "
                    ></div>

                </div>


                <div class="budget-percent">

                    ${monthPercent}% 已使用

                </div>


                <div class="budget-info">

                    剩余预算：

                    <strong
                        class="${monthRemainingClass}"
                    >

                        ¥${money(
                            totalBudget.monthRemaining
                        )}

                    </strong>

                </div>

            </div>


            <!-- =========================
                 年度总预算
            ========================== -->

            <div class="card total-budget-card">

                <div class="small">
                    年度预算
                </div>


                <div class="big-number">
                    ¥${money(
                        totalBudget.yearUsed
                    )}
                </div>


                <div class="budget-info">

                    已消费 /
                    ¥${money(
                        totalBudget.yearly
                    )}
                    总预算

                </div>


                <div class="budget-bar">

                    <div
                        class="budget-fill"
                        style="
                            width:${yearPercent}%;
                        "
                    ></div>

                </div>


                <div class="budget-percent">

                    ${yearPercent}% 已使用

                </div>


                <div class="budget-info">

                    剩余预算：

                    <strong
                        class="${yearRemainingClass}"
                    >

                        ¥${money(
                            totalBudget.yearRemaining
                        )}

                    </strong>

                </div>

            </div>


            <!-- =========================
                 状态统计
            ========================== -->

            <div class="stat-grid">


                <div class="stat-card">

                    <div class="stat-title">
                        待审批
                    </div>

                    <div class="stat-value">
                        ${pending}
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-title">
                        已通过
                    </div>

                    <div class="stat-value">
                        ${approved}
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-title">
                        已购买
                    </div>

                    <div class="stat-value">
                        ${purchased}
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-title">
                        总申请
                    </div>

                    <div class="stat-value">
                        ${data.expenses.length}
                    </div>

                </div>


            </div>


            <div style="height:14px"></div>


            <button
                class="btn"
                onclick="showNewExpense()">

                ＋ 新建消费申请

            </button>


            <div style="height:20px"></div>


            <div class="section-title">
                最近申请
            </div>

    `;


    const recent =

        [...data.expenses]

            .sort(
                (a,b) =>
                    b.id - a.id
            )

            .slice(0,5);


    if (
        recent.length === 0
    ) {

        html += `

            <div class="card empty">

                还没有消费申请

            </div>

        `;

    } else {

        recent.forEach(
            expense => {

                html +=
                    expenseCard(
                        expense
                    );

            }
        );

    }


    html += `

        </div>

    `;


    document
        .getElementById("app")
        .innerHTML = html;

}


/* =====================================================
   消费卡片
===================================================== */

function expenseCard(
    expense
) {

    const stepCount =
        STEPS.length;


    const completed =
        expense.approvals.length;


    const percent =
        Math.round(

            completed /
            stepCount *
            100

        );


    return `

        <div

/* =====================================================
   提交审批
===================================================== */

function submitApproval(
    event,
    expenseId,
    stepIndex
) {

    event.preventDefault();


    const form =
        event.target;


    const answer =
        form.querySelector(
            'input[name="answer"]:checked'
        ).value;


    const comment =
        form.querySelector(
            'textarea[name="comment"]'
        ).value
        .trim();


    const expense =
        data.expenses.find(
            e =>
                e.id === expenseId
        );


    if (!expense) {

        return;

    }


    expense.approvals.push({

        step:
            stepIndex,

        answer,

        comment,

        createdAt:
            new Date().toISOString()

    });


    if (
        stepIndex ===
        STEPS.length - 1
    ) {

        if (
            answer === "通过"
        ) {

            expense.status =
                "approved";

        }

        else if (
            answer === "拒绝"
        ) {

            expense.status =
                "rejected";

        }

        else {

            /*
             * 暂缓以后，
             * 最终节点可以重新选择。
             */

            expense.status =
                "pending";


            expense.currentStep =
                stepIndex;


            expense.approvals =
                expense.approvals.filter(
                    a =>
                        a.step !==
                        stepIndex
                );

        }

    }

    else {

        expense.currentStep =
            stepIndex + 1;

    }


    saveData();


    showExpense(
        expenseId
    );

}

/* =====================================================

===================================================== */

function exportData() {

    const json =
        JSON.stringify(
            data,
            null,
            2
        );


    const blob =
        new Blob(

            [json],

            {
                type:
                    "application/json"
            }

        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;


    a.download =
        "personal-expense-backup-" +
        today() +
        ".json";


    a.click();


    URL.revokeObjectURL(
        url
    );

}


/* =====================================================
   数据导入
===================================================== */

function importData(
    event
) {

    const file =
        event.target.files[0];


    if (!file) {

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(e) {

            try {

                const imported =
                    JSON.parse(
                        e.target.result
                    );


                if (

                    !imported.expenses ||

                    !imported.budgets

                ) {

                    throw new Error();

                }


                /*
                 * 如果是旧版本备份，
                 * 没有总预算，
                 * 自动补上默认总预算。
                 */

                if (
                    !imported.totalBudget
                ) {

                    imported.totalBudget =
                        JSON.parse(
                            JSON.stringify(
                                DEFAULT_TOTAL_BUDGET
                            )
                        );

                }


                if (

                    !confirm(
                        "导入数据会覆盖当前数据，确定继续吗？"
                    )

                ) {

                    return;

                }


                data =
                    imported;


                saveData();


                alert(
                    "数据导入成功"
                );


                renderSettings();


            } catch (error) {

                alert(
                    "数据文件无效"
                );

            }

        };


    reader.readAsText(
        file
    );

}

        .querySelectorAll(
            ".nav-btn"
        )

        .forEach(
            btn =>
                btn.classList
                    .remove(
                        "active"
                    )
        );


    if (
        page === "home"
    ) {

        document

            .querySelectorAll(
                ".nav-btn"
            )[0]

            .classList

            .add(
                "active"
            );


        renderHome();

    }


    else if (
        page === "pending"
    ) {

        document

            .querySelectorAll(
                ".nav-btn"
            )[1]

            .classList

            .add(
                "active"
            );


        renderPending();

    }


    else if (
        page === "records"
    ) {

        document

            .querySelectorAll(
                ".nav-btn"
            )[2]

            .classList

            .add(
                "active"
            );


        renderRecords();

    }


    else if (
        page === "settings"
    ) {

        document

            .querySelectorAll(
                ".nav-btn"
            )[3]

            .classList

            .add(
                "active"
            );


        renderSettings();

    }

}


/* =====================================================
   启动
===================================================== */

renderHome();

</script>

</body>
</html>
